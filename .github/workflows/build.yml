name: Build ImmortalWrt Firmware

on:
  workflow_dispatch: # 允许你在网页上手动点按钮触发编译

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3 python3-pip python3-setuptools rsync unzip zlib1g-dev file wget

      - name: 3. 更新并安装 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 4. 加载自定义配置并展开依赖
        run: |
          # 自动读取仓库根目录里的 .config 文件，并补齐 AdGuardHome 等依赖
          make defconfig

      - name: 5. 下载依赖包
        run: |
          make download -j8

      - name: 6. 开始编译
        run: |
          # 先全速编译，如果报错，再单线程输出详细日志报错
          make -j$(nproc) || make -j1 V=s

      - name: 7. 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-newifi-d2
          path: bin/targets/ramips/mt7621/*.bin
